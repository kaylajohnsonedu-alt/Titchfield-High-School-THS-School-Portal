<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titchfield High School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
       
        <a href="#" class="logo-container">
            <img src="assets/logo.png" alt="School logo" class="logo">
            <div class="school-info">
                <h1>Titchfield High School</h1>
                <span>Virtute Et Eruditione</span>
            </div>
        </a>

     
       
    </header>
        <main>
        <div class="banner">
            <div class="title-wrap">
                <h1>Registration Form</h1>
                <div class="line"></div>
    
                
                <div class="form-container">
                    
                   <form id="registration-form">
                    

                        <div class="form-group">
                            <label for="avatar">Upload a Image of Student (JPEG/PNG, max 500KB):</label>
                            <input type="file" id="avatar" name="avatar" accept="image/jpeg, image/png" required>
                        </div>

                        <div class="form-group">
                            <label for="fname">First Name:</label>
                            <input type="text" id="fname" name="fname" placeholder="John" required>
                        </div>

                         <div class="form-group">
                            <label for="middleName">Middle Name:</label>
                            <input type="text" id="Mname" name="Mname" placeholder="Alphonsus" required>
                        </div>

                        <div class="form-group">
                            <label for="lname">Last Name:</label>
                            <input type="text" id="lname" name="lname" placeholder="Doe" required>
                        </div>

                        <div class="form-group">
                            <label for="address">Address:</label>
                            <input date="text" id="adress" name="address" placeholder="12 battylane" required>
                        </div>
                        

                        <div class="form-group">
                            <label for="emailL">Email:</label>
                            <input type="email" id="emailL" name="email" placeholder="placeholder@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="Date Of Birth:">Date of Birth:</label>
                            <input type="date" id="DOB" name="DOB" placeholder="Doe" required>
                        </div>

                       <div class="form-group" >
                       <label for="Gradelvl">Grade Level:</label>
                       <select id="gradelvl" name="gradelvl">

                            <option value=" ">Select Grade Level</option>
                            <option value="">First Form</option>
                            <option value="">Second Form</option>
                            <option value="">Third Form</option>
                            <option value="">Fourth Form</option>
                            <option value="">Fifth Form</option>
                            <option value="">Sixth Form</option>
                            
                        </select>
                        </div>

                         <div class="form-group">
                            <label for="PrevSchool">Previous School: </label>
                            <input type="text" id="PrevSchool" name="PrevSchool" placeholder="Kingston College" required>
                        </div>

                        <h3> Parent/ Guardian Information</h3>
                        <div class="form-group">
                            <label for="Parent/ Guardian First Name">Parent/ Guardian First Name:</label>
                            <input type="text" id="PGname" name="PGname" placeholder="Jane" required>
                        </div>
                        <div class="form-group">
                            <label for="PGlname">Parent/ Guardian Last Name:</label>
                            <input type="text" id="lname" name="lname" placeholder="Doe" required>
                        </div>

                        <div class="form-group">
                            <label for="number">Parent/ Guardian Contact Number:</label>
                            <input type="tel" id="PGcontact" name="PGcontact" placeholder="876-123-4567" required>
                        </div>
                         <div class="form-group">
                            <label>I can confirm that all the information entered above is correct :</label>
                            <input type="radio" name="confirm" value="confirm">
                            <label>Confirm</label>
                        </div>
                        
                        <button type="submit" class="btn">Submit</button>
                        <a href="Index.html" class="button-link">
                            <button type="return" class="btn">Return</button>
                        </a>

                       
                        

                    
                </div>
            </div>
        </div>
    </main>
   
      
    </section>
    </div>
    

</body>
</html>
