<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titchfield High School — Edit Registration</title>
    <link rel="stylesheet" href="/css/common (1).css">
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <img src="../assets/logo2.png" alt="School logo" class="logo">
           
    </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    

    <main>
        <div class="banner">
            <div class="title-wrap">
                <h1>Edit Registration Information</h1>
                <div class="line"></div>

                <div class="form-container">
                    <form id="edit-registration-form">

                     

                        <div class="form-group">
                            <label for="avatar">Update Image of Student (JPEG/PNG, max 500KB):</label>
                            <input type="file" id="avatar" name="avatar" accept="image/jpeg, image/png">
                            <div id="avatar-preview-wrap" style="margin-top: 10px; display: none;">
                                <img id="avatar-preview" src="" alt="Current student image" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 2px solid #314991;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="fname">First Name:</label>
                            <input type="text" id="fname" name="fname" placeholder="John" required>
                        </div>

                        <div class="form-group">
                            <label for="Mname">Middle Name:</label>
                            <input type="text" id="Mname" name="Mname" placeholder="Alphonsus">
                        </div>

                        <div class="form-group">
                            <label for="lname">Last Name:</label>
                            <input type="text" id="lname" name="lname" placeholder="Doe" required>
                        </div>

                        <div class="form-group">
                            <label for="adress">Address:</label>
                            <input type="text" id="adress" name="address" placeholder="12 Hope Road" required>
                        </div>

                        <div class="form-group">
                            <label for="emailL">Email:</label>
                            <input type="email" id="emailL" name="email" placeholder="placeholder@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="DOB">Date of Birth:</label>
                            <input type="date" id="DOB" name="DOB" required>
                        </div>

                        <div class="form-group">
                            <label for="gradelvl">Grade Level:</label>
                            <select id="gradelvl" name="gradelvl" required>
                                <option value="">Select Grade Level</option>
                                <option value="Grade 7">Grade 7</option>
                                <option value="Grade 8">Grade 8</option>
                                <option value="Grade 9">Grade 9</option>
                                <option value="Grade 10">Grade 10</option>
                                <option value="Grade 11">Grade 11</option>
                                <option value="Grade 12">Grade 12</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="PrevSchool">Previous School:</label>
                            <input type="text" id="PrevSchool" name="PrevSchool" placeholder="Kingston College">
                        </div>

                        <h3>Parent / Guardian Information</h3>

                        <div class="form-group">
                            <label for="PGname">Parent/Guardian First Name:</label>
                            <input type="text" id="PGname" name="PGname" placeholder="Jane">
                        </div>

                        <div class="form-group">
                            <label for="PGlname">Parent/Guardian Last Name:</label>
                            <input type="text" id="PGlname" name="PGLname" placeholder="Doe">
                        </div>

                        <div class="form-group">
                            <label for="PGcontact">Parent/Guardian Contact Number:</label>
                            <input type="tel" id="PGcontact" name="PGcontact" placeholder="876-123-4567">
                        </div>

                        <div class="form-group">
                            <label>I confirm that the updated information above is accurate:</label>
                            <div style="display: flex; align-items: center; gap: 8px; margin-top: 5px;">
                                <input type="radio" id="confirm" name="confirm" value="confirm" required>
                                <label for="confirm" style="margin-bottom: 0;">Confirm Changes</label>
                            </div>
                        </div>

                        <p id="edit-status" class="message" aria-live="polite"></p>

                        <button type="submit" class="btn">Save Changes</button>
                        <button type="button" id="reset-btn" class="btn" style="margin-left: 6px;">Reset Fields</button>

                        <a href="index.html" class="btn" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box; line-height: normal; padding-top: 10px; margin-top: 10px;">Return</a>

                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/edit.js" defer></script>
</body>
</html>
